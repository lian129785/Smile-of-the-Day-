<title>Smile of the Day 💜</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #2b0040, #4b007d);
        font-family: "Poppins", sans-serif;
        color: white;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: pink;
        opacity: 0.7;
        transform: rotate(45deg);
        animation: float 6s linear infinite;
    }

    .heart:before,
    .heart:after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 50%;
    }

    .heart:before { top: -10px; left: 0; }
    .heart:after { left: 10px; top: 0; }

    @keyframes float {
        from { transform: translateY(0) rotate(45deg); opacity: 1; }
        to { transform: translateY(-200px) rotate(45deg); opacity: 0; }
    }

    .card {
        background: rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 0 20px rgba(200, 100, 255, 0.4);
        animation: fadeIn 0.6s ease;
        position: relative;
        z-index: 10;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    img {
        width: 250px;
        border-radius: 15px;
        margin-top: 20px;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .buttons {
        margin-top: 25px;
        display: flex;
        justify-content: space-between;
    }

    button {
        background: #a64cff;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #c27bff;
        transform: scale(1.05);
    }
</style>
</head>
<body>

<script>
for (let i = 0; i < 20; i++) {
    let h = document.createElement("div");

}
</script>

let history = [];
let index = -1;

function showMessage(i) {
    document.getElementById("msg").innerText = history[i].text;
    document.getElementById("gif").src = history[i].gif;
}

function nextMessage() {
    const randomIndex = Math.floor(Math.random() * messages.length);
    history.push(messages[randomIndex]);
    index = history.length - 1;
    showMessage(index);
}

function prevMessage() {
    if (index > 0) {
        index--;
        showMessage(index);
    }
}

nextMessage();
